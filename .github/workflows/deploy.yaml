name: Deploy to GCP

on:
  push:
    branches: [ "master" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Authenticate to GCP
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: "projects/1055616729020/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
        service_account: "github-ci-cd@hospitalreadmission-489606.iam.gserviceaccount.com"

    - name: Set up gcloud
      uses: google-github-actions/setup-gcloud@v2

    - name: Test access
      run: gcloud projects list